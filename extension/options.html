<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { max-width: 560px; margin: 24px auto; padding: 0 16px; font: 14px/1.7 -apple-system, 'PingFang SC', 'Segoe UI', sans-serif; color: #1f2937; }
    h1 { font-size: 18px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
    .hint { color: #6b7280; font-size: 12px; margin-top: 4px; }
    .row { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
    button { all: unset; cursor: pointer; color: #fff; background: #4f46e5; border-radius: 8px; padding: 8px 16px; font-size: 13px; }
    button.ghost { color: #4f46e5; background: #eef2ff; }
    button:hover { opacity: .9; }
    #testResult { font-size: 13px; }
    #testResult.ok { color: #059669; }
    #testResult.err { color: #dc2626; }
  </style>
</head>
<body>
  <h1>MagicLens 词镜 · 设置</h1>

  <div class="field">
    <label for="apiBase">moon-well 服务地址</label>
    <input type="text" id="apiBase" placeholder="http://192.168.31.9:8082">
    <div class="hint">moon-well 后端地址；目前仅内网可达，公网入口（Traefik 路由）建立后改为 https 地址。</div>
  </div>

  <div class="field">
    <label for="token">访问 Token</label>
    <input type="password" id="token" placeholder="mk-… 或 JWT">
    <div class="hint">moon-well 静态 API-key（user.token，mk- 前缀）或登录 JWT，将以 Bearer 方式携带。仅保存在浏览器本地。</div>
  </div>

  <div class="field">
    <label><input type="checkbox" id="autoTranslate"> 选中即自动翻译（关闭后需点气泡里的「译」）</label>
  </div>

  <div class="field">
    <label><input type="checkbox" id="skipMemoryDefault"> 伴读聊天默认「本会话不记忆」（建议开启，隐私优先）</label>
  </div>

  <div class="row">
    <button id="save">保存</button>
    <button id="test" class="ghost">测试连接</button>
    <span id="testResult"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
