<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { max-width: 560px; margin: 24px auto; padding: 0 16px; font: 14px/1.7 -apple-system, 'PingFang SC', 'Segoe UI', sans-serif; color: #1f2937; }
    h1 { font-size: 18px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    #loginStatus { margin-bottom: 10px; }
    #loginStatus.ok { color: #059669; }
    #loginStatus.bad { color: #dc2626; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    button { all: unset; cursor: pointer; color: #fff; background: #4f46e5; border-radius: 8px; padding: 8px 16px; font-size: 13px; }
    button.ghost { color: #4f46e5; background: #eef2ff; }
    button:hover { opacity: .9; }
    #testResult { font-size: 13px; }
    #testResult.ok { color: #059669; }
    #testResult.err { color: #dc2626; }
    .hint { color: #6b7280; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>MagicLens 词镜 · 设置</h1>

  <div class="field">
    <label>账号</label>
    <div id="loginStatus" class="bad">检测中…</div>
    <div class="row">
      <button id="loginBtn">登录</button>
      <button id="logoutBtn" class="ghost" hidden>退出登录</button>
      <button id="test" class="ghost">测试连接</button>
      <span id="testResult"></span>
    </div>
    <div class="hint">登录会打开 moon-well 的统一登录页（Authentik，与 magicbook 同一账号）。登录成功后令牌自动保存，无需手动填写；后端固定走公网域名 moon-well.haoshenqi.top，内外网均可使用。</div>
  </div>

  <div class="field">
    <label><input type="checkbox" id="autoTranslate"> 选中即自动翻译（关闭后需点气泡里的「译」）</label>
  </div>

  <script src="options.js"></script>
</body>
</html>
